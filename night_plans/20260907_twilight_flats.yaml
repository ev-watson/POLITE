# Monday 2026-09-07 (Julian) -- EVENING TWILIGHT FLATS, first pointed use of the
# repaired mount. There is no even-illumination panel yet, so the twilight sky
# is the only flat source POLITE has; 20260819_calibration.yaml (panel) does NOT
# run tonight.
#
# >>> TWILIGHT WINDOW (computed for the obs_utils site constants
#     33.0701 N, -116.6451, 1294 m -- block_log.JULIAN_*; 2026-09-07) <<<
#   sunset 19:03 PDT | civil (-6) 19:28 | -8 19:38 | nautical (-12) 19:57
#   astronomical (-18) 20:27 | moon 10% illuminated, SET at 17:00 -> dark night
# START THIS PLAN AT ~19:08 PDT (sun ~ -2 deg). It ends ~19:48 (sun ~ -10).
#
# >>> WHY AN EXPOSURE LADDER AND NOT ONE EXPOSURE <<<
# POLITE has never taken a pointed twilight flat, so the sky count rate at this
# aperture/throughput/operating point is UNMEASURED -- any single exposure is a
# guess against a source that fades ~1 mag every few minutes. The plan therefore
# sweeps 0.2 s -> 20 s across five passes as the sky decays. This is the same
# tactic the 2026-07-17 twilight PTC used (repeat invocations across the fading
# window); here the ladder is inside one invocation so it runs unattended.
# In reduction: KEEP the passes whose median lands in the usable range and throw
# the rest away. Saturated and near-empty sets are expected and are not a fault.
#
# >>> POINTING: alt: IS A ZENITH DISTANCE <<<
# PWI4's horizontal coordinate at POLITE is zenith distance (0 = zenith,
# 90 = horizon) and the shed-safe window is 3--42 deg. `alt: 20` below therefore
# means 70 deg ABOVE the horizon. az 101 is the anti-solar azimuth for this
# window (sun az 279.5 -> 283.6 across 19:19--19:48).
#
# TRACKING IS OFF on purpose: at 0.224"/px an untracked star trails ~67 px/s, so
# stars smear into faint streaks that a median combine removes. This is the only
# star-rejection this plan has.
#
# >>> SKY POLARIZATION (why 4 HWP angles per rung) <<<
# Inside the 3--42 deg window the Arago/Babinet neutral points are unreachable
# (they sit ~20 deg from the anti-solar/solar point, i.e. z ~ 76 deg), so the
# twilight sky POLITE can point at is strongly linearly polarized -- scattering
# angle ~76 deg at this pointing, near the sin^2/(1+cos^2) maximum. Two things
# handle it, and both are why the rungs are pol_flat and not plain flats:
#   1. The sky polarization is spatially UNIFORM over a 23'x16' field, so it is a
#      scalar per frame; normalising each frame by its own median removes it.
#   2. Summing the 4 equally spaced HWP angles cancels the 4-theta modulation
#      identically (sum cos4t = sum sin4t = 0), which is what protects against a
#      spatially VARYING instrumental polarization response. ESTABLISHED (algebra).
# 8-angle science-matched flats are a later refinement, for the panel; they do
# not fit in a 40-minute twilight window.
#
# >>> HOW TO RUN (see night_plans/20260907_night_sheet.md for the full timeline) <<<
#   Preview: scripts/execute_night.py night_plans/20260907_twilight_flats.yaml
#   Run:     scripts/execute_night.py night_plans/20260907_twilight_flats.yaml \
#              --run --subdir twiflat --yes --no-mount-home
# --no-mount-home: home the mount ONCE in the afternoon (see the night sheet);
# homing here would burn the twilight window. --yes so a cooler-gate timeout
# cannot block on stdin -- PRE-COOL from ~18:15 so the gate passes immediately.
#
# IF THE MOUNT REPAIR FAILED: this plan still yields usable flats unpointed --
#   ... --run --mount off --unpointed --subdir twiflat_unpointed
# at whatever fixed attitude the mount holds. Sky uniformity is then unverified;
# note it and reduce with caution. The standards plans are scrubbed in that case.

uses: palette.yaml
session: "20260907"
observer: "POLITE"
telescope: "CDK20"
observatory: "Julian, CA"
base_data_dir: FITSDATA
naming: polite
calibrate_stage: after

camera:
  readout_mode: 5
  readout_mode_name: "Mode 5"
  gain: 56
  offset: 20
  cooler_setpoint_c: -10.0
  cooler_policy: at_or_below

bricks:
  # One rung = 4 HWP angles x 4 frames = 16 frames. Angle set {0, 22.5, 45,
  # 67.5} is the minimum that cancels the 4-theta term exactly.
  flatV_0p2: {type: pol_flat, filter: "Photometric V", angles: 4, exp: 0.2, n: 4,
              imagetyp: FLAT, object_name: TwilightFlat, pol_seq_id: "twiflatV_0p2_20260907"}
  flatV_0p5: {type: pol_flat, filter: "Photometric V", angles: 4, exp: 0.5, n: 4,
              imagetyp: FLAT, object_name: TwilightFlat, pol_seq_id: "twiflatV_0p5_20260907"}
  flatV_1p2: {type: pol_flat, filter: "Photometric V", angles: 4, exp: 1.2, n: 4,
              imagetyp: FLAT, object_name: TwilightFlat, pol_seq_id: "twiflatV_1p2_20260907"}
  flatV_3:   {type: pol_flat, filter: "Photometric V", angles: 4, exp: 3.0, n: 4,
              imagetyp: FLAT, object_name: TwilightFlat, pol_seq_id: "twiflatV_3_20260907"}
  flatV_8:   {type: pol_flat, filter: "Photometric V", angles: 4, exp: 8.0, n: 4,
              imagetyp: FLAT, object_name: TwilightFlat, pol_seq_id: "twiflatV_8_20260907"}
  flatV_20:  {type: pol_flat, filter: "Photometric V", angles: 4, exp: 20.0, n: 4,
              imagetyp: FLAT, object_name: TwilightFlat, pol_seq_id: "twiflatV_20_20260907"}

# Five passes over the same anti-solar sky point, each re-verifying the
# zenith-distance gate. The rungs climb with the fading sky; passes overlap by
# one rung so no sky level falls between two passes.
plan:
  - {target: "TwilightSky-A", alt: 20, az: 101, track: false,   # ~19:08, sun ~ -2
     lay: [flatV_0p2, flatV_0p5, flatV_1p2]}
  - {target: "TwilightSky-B", alt: 20, az: 101, track: false,   # ~19:14
     lay: [flatV_0p5, flatV_1p2, flatV_3]}
  - {target: "TwilightSky-C", alt: 20, az: 101, track: false,   # ~19:21
     lay: [flatV_1p2, flatV_3, flatV_8]}
  - {target: "TwilightSky-D", alt: 20, az: 101, track: false,   # ~19:30
     lay: [flatV_3, flatV_8, flatV_20]}
  - {target: "TwilightSky-E", alt: 20, az: 101, track: false,   # ~19:40, sun ~ -9
     lay: [flatV_8, flatV_20]}
