# SALVAGE night plan - 2026-07-09 (Julian) - NO TELESCOPE POINTING
# DEC drive is dead; engaging DEC auto-disconnects the mount. This plan NEVER
# slews: bias/darks/flats need no pointing, and the science targets are
# coordinate-less ("in the current field"), so the runner captures at whatever
# fixed pointing the tube is stuck at.
#
# >>> HISTORICAL (executed + reduced 2026-07-09; kept as a brick-system example) <<<
# Dead DEC: the runner must NEVER enable motors. Capture used a NO-MOUNT runner
# (camera+EFW+HWP) that fail-closes if the ASCOM Remote EFW driver's filter Names
# don't match the installed carousel (Clear,B,V,R,Dark) and pauses for the manual
# +45deg whole-polarimeter rotation. plan_night.py previews only.
# Re-run with: execute_night.py <this file> --run
# (no target here names ra/dec or alt/az, so --mount auto leaves PWI4 alone and
# no --unpointed acknowledgement is needed; the HWP comes up automatically
# because the plan steps hwp_deg.)
#
# Goal is QUALITATIVE instrument commissioning: is HWP modulation present, can the
# beam pair be tracked frame-by-frame, does the detector-frame Stokes vector
# transform under a whole-instrument rotation. NOT calibrated P/PA (needs a mount).

uses: palette.yaml
session: "20260709"          # data -> FITSDATA/20260709/
observer: "POLITE"
telescope: "CDK20"
observatory: "Julian, CA"
base_data_dir: FITSDATA
naming: polite
calibrate_stage: both        # bias before, darks after

camera:
  readout_mode: 0
  readout_mode_name: "Mode 0"
  gain: 0
  offset: 30
  egain_e_per_adu: 1.0
  ron_e: 3.5
  cooler_setpoint_c: -20.0
  pixel_size_um: 3.76
  plate_scale_arcsec: 0.224

# Salvage-only bricks (self-contained; not added to the shared palette).
bricks:
  # Drift-through polarimetry. exp MUST be tuned to the in-field pair's declination:
  # drift rate = 15*cos(dec) arcsec/s / 0.224 arcsec/px  (~67 px/s near the equator).
  # Keep the per-frame trail under ~2 px. 0.05 s is a starting point for a near-
  # equatorial pair with NO RA hold; lengthen if RA holds the field, shorten if it trails.
  polV8_drift: {type: pol_seq, filter: "Photometric V", angles: 8, exp: 0.05, n: 2}
  # Night-sky SUPER-FLAT: dedicated drift LIGHT frames, median/sigma-clip-combined
  # into one flat PER HWP ANGLE in reduction. No sky (2am) and no even illuminator,
  # so the flat is built from the data itself -- the field drifts (dead DEC) so
  # stars land on different pixels and are rejected, leaving the per-beam response
  # through the full HWP+Savart train. 8 angles match polV8_drift so every science
  # angle has a flat. exp MUST equal polV8_drift (same signal regime); n=20 is a
  # floor for star rejection in a sparse field -- raise if the field is crowded.
  # These are LIGHT frames (IMAGETYP=LIGHT), NOT illuminated FLATs; label is honest.
  superflatV_drift: {type: pol_seq, filter: "Photometric V", angles: 8, exp: 0.05, n: 20}
  # Matched darks for the drift exposure. If you change polV8_drift/superflatV_drift
  # exp, change this to match (both use 0.05 s).
  darks_drift:
    type: cal_multi
    frames:
      - {frame: DARK, exp: 0.05, n: 15}

qa_gates:
  - after_cal: bias25
    handler: bias_qa
    args: {abort_on_fail: false}   # detector sanity still valid without a mount
  - handler: sequence_audit
    args: {}                       # HWP angle-set completeness per POLSEQ
  # NOTE: first_light_qa is intentionally omitted - it compares to catalog P/PA,
  # which is meaningless for uncalibrated drift frames with no known target.

plan:
  # --- bias first (no pointing) ---
  - cal: [bias25]

  # --- night-sky SUPER-FLAT from drifting frames (no illuminator available) ---
  # 2am, no twilight/sky flat and no even illuminator, so we DON'T take dedicated
  # illuminated flats (pointing the polarimeter at a dark dome just yields darks
  # mislabeled as flats). Instead collect many drifting LIGHT frames and build the
  # flat in reduction by median/sigma-clip-combining PER HWP ANGLE. Qualitative
  # flat only: captures two-beam geometry + relative throughput, not a high-SNR
  # pixel flat (the night sky here is faint). Tune superflatV_drift exp/n at the
  # console: the field must visibly move between frames, star-free majority/pixel.
  - {target: "Night-sky super-flat V (drift)", track: false, lay: [{superflatV_drift: {pol_seq_id: "superflatV_drift"}}]}

  # --- drift polarimetry on the brightest isolated pair currently in the field ---
  # Coordinate-less targets => runner takes frames at the current pointing, no slew.
  - {target: "Drift pair A",        track: false, lay: [{polV8_drift: {pol_seq_id: "driftA_polV8"}}]}
  - {target: "Drift pair A rep2",   track: false, lay: [{polV8_drift: {pol_seq_id: "driftA_polV8_rep2"}}]}
  #   >>> MANUAL: rotate the WHOLE polarimeter (field rotator) +45 deg, confirm both
  #       beams still on the detector, then run the rotated repeat below. <<<
  - {target: "Drift pair A +45rot", track: false, lay: [{polV8_drift: {pol_seq_id: "driftA_polV8_rot45"}}]}

  # --- darks after: matched to every exposure used. Science drift AND the super-
  #     flat are both 0.05 s -> darks_drift covers them; darks_short (0.2/2/5 s)
  #     kept for short-dark sanity / DSNU. ---
  - cal: [darks_drift, darks_short]
