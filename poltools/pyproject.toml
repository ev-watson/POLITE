[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poltools"
version = "0.1.0"
description = "Imaging polarimetry simulator and Stokes pipeline for dual-beam HWP polarimeters"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "POLITE Observatory Team" }]
keywords = ["astronomy", "polarimetry", "stokes", "mueller", "photometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "photutils",
    "matplotlib",
    "caltools>=0.1.0",
]

[tool.setuptools]
package-dir = {"poltools" = "."}
packages = ["poltools"]
